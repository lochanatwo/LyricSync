name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows standalone app and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check browser script syntax
        run: |
          node --check WebRemote/app.js
          node --check WebRemote/key-logic.js
          node --test Tests/KeyLogic.test.js
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON
      - name: Build standalone app and tests
        run: cmake --build build --config Release --target VocLyrics_Standalone VocLyricsTests --parallel
      - name: Run unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package Windows standalone app
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'VocLyrics-Windows'
          New-Item -ItemType Directory -Force -Path (Join-Path $stage 'Standalone') | Out-Null
          Copy-Item 'build/VocLyrics_artefacts/Release/Standalone/VocLyrics.exe' (Join-Path $stage 'Standalone/VocLyrics.exe')
          Copy-Item 'README.md' (Join-Path $stage 'README.txt')
          Compress-Archive -Path $stage -DestinationPath 'VocLyrics-Windows.zip' -Force
      - name: Upload Windows standalone app
        uses: actions/upload-artifact@v4
        with:
          name: VocLyrics-Standalone-Windows
          path: VocLyrics-Windows.zip
          if-no-files-found: error

  macos:
    name: macOS universal standalone app and tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure universal build
        run: >-
          cmake -S . -B build -G Xcode
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DBUILD_TESTING=ON
      - name: Build standalone app and tests
        run: cmake --build build --config Release --target VocLyrics_Standalone VocLyricsTests --parallel
      - name: Run unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package macOS standalone app
        run: |
          mkdir -p "$RUNNER_TEMP/VocLyrics-macOS"
          cp -R build/VocLyrics_artefacts/Release/Standalone/VocLyrics.app "$RUNNER_TEMP/VocLyrics-macOS/"
          cp README.md "$RUNNER_TEMP/VocLyrics-macOS/README.txt"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/VocLyrics-macOS" VocLyrics-macOS.zip
      - name: Upload macOS standalone app
        uses: actions/upload-artifact@v4
        with:
          name: VocLyrics-Standalone-macOS-universal
          path: VocLyrics-macOS.zip
          if-no-files-found: error
