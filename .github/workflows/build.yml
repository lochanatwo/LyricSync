name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows VST3, standalone app and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON
      - name: Build plugin and tests
        run: cmake --build build --config Release --target VocLyrics_VST3 VocLyrics_Standalone VocLyricsTests --parallel
      - name: Run unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload Windows VST3
        uses: actions/upload-artifact@v4
        with:
          name: VocLyrics-VST3-Windows
          path: build/VocLyrics_artefacts/Release/VST3/VocLyrics.vst3
          if-no-files-found: error
      - name: Upload Windows standalone app
        uses: actions/upload-artifact@v4
        with:
          name: VocLyrics-Standalone-Windows
          path: build/VocLyrics_artefacts/Release/Standalone/VocLyrics.exe
          if-no-files-found: error

  macos:
    name: macOS universal VST3, standalone app and tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure universal build
        run: >-
          cmake -S . -B build -G Xcode
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DBUILD_TESTING=ON
      - name: Build plugin and tests
        run: cmake --build build --config Release --target VocLyrics_VST3 VocLyrics_Standalone VocLyricsTests --parallel
      - name: Run unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload macOS VST3
        uses: actions/upload-artifact@v4
        with:
          name: VocLyrics-VST3-macOS-universal
          path: build/VocLyrics_artefacts/Release/VST3/VocLyrics.vst3
          if-no-files-found: error
      - name: Upload macOS standalone app
        uses: actions/upload-artifact@v4
        with:
          name: VocLyrics-Standalone-macOS-universal
          path: build/VocLyrics_artefacts/Release/Standalone/VocLyrics.app
          if-no-files-found: error
