name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows VST3, standalone app and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON
      - name: Build plugin and tests
        run: cmake --build build --config Release --target VocLyrics_VST3 VocLyrics_Standalone VocLyricsTests --parallel
      - name: Run unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package Windows app and VST3 together
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'VocLyrics-Windows'
          New-Item -ItemType Directory -Force -Path (Join-Path $stage 'Standalone') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $stage 'Plugins') | Out-Null
          Copy-Item 'build/VocLyrics_artefacts/Release/Standalone/VocLyrics.exe' (Join-Path $stage 'Standalone/VocLyrics.exe')
          Copy-Item 'build/VocLyrics_artefacts/Release/VST3/VocLyrics.vst3' (Join-Path $stage 'Plugins/VocLyrics.vst3') -Recurse
          Copy-Item 'README.md' (Join-Path $stage 'README.txt')
          Compress-Archive -Path $stage -DestinationPath 'VocLyrics-Windows.zip' -Force
      - name: Upload all-in-one Windows package
        uses: actions/upload-artifact@v4
        with:
          name: VocLyrics-All-in-One-Windows
          path: VocLyrics-Windows.zip
          if-no-files-found: error

  macos:
    name: macOS universal VST3, standalone app and tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure universal build
        run: >-
          cmake -S . -B build -G Xcode
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DBUILD_TESTING=ON
      - name: Build plugin and tests
        run: cmake --build build --config Release --target VocLyrics_VST3 VocLyrics_Standalone VocLyricsTests --parallel
      - name: Run unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package macOS app and VST3 together
        run: |
          mkdir -p "$RUNNER_TEMP/VocLyrics-macOS/Standalone" "$RUNNER_TEMP/VocLyrics-macOS/Plugins"
          cp -R build/VocLyrics_artefacts/Release/Standalone/VocLyrics.app "$RUNNER_TEMP/VocLyrics-macOS/Standalone/"
          cp -R build/VocLyrics_artefacts/Release/VST3/VocLyrics.vst3 "$RUNNER_TEMP/VocLyrics-macOS/Plugins/"
          cp README.md "$RUNNER_TEMP/VocLyrics-macOS/README.txt"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/VocLyrics-macOS" VocLyrics-macOS.zip
      - name: Upload all-in-one macOS package
        uses: actions/upload-artifact@v4
        with:
          name: VocLyrics-All-in-One-macOS-universal
          path: VocLyrics-macOS.zip
          if-no-files-found: error

